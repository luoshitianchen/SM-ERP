<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SM ERP</title><style>:root{--nav:#102a43;--bg:#f5f7fa;--blue:#005bd6;--line:#dfe1e6;--text:#172b4d;--muted:#6b778c}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px system-ui,"Microsoft YaHei";color:var(--text)}.login{min-height:100vh;display:grid;place-items:center;background:var(--nav)}.login-box{width:min(400px,calc(100% - 32px));padding:30px;background:#fff;border-radius:6px}.login-box h1{margin:0 0 8px}.login-box p{color:var(--muted)}input,select{width:100%;padding:10px;border:1px solid #b3bac5;border-radius:3px;margin:5px 0 14px;font:inherit}button{border:0;border-radius:3px;padding:10px 14px;background:var(--blue);color:#fff;font-weight:700;cursor:pointer}.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{background:var(--nav);color:#d9e2ec;padding:20px 12px}.brand{font-size:18px;font-weight:800;padding:6px 10px 30px}.nav{padding:10px;color:#fff;background:#193b59;border-radius:4px}.main{padding:30px;max-width:1300px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center}.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin:24px 0}.card{background:#fff;border:1px solid var(--line);padding:18px;border-radius:4px}.value{font-size:30px;font-weight:800;margin:10px 0}.muted{color:var(--muted);font-size:12px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:11px;border-bottom:1px solid var(--line)}.table th{font-size:11px;color:var(--muted)}.hidden{display:none}@media(max-width:700px){.shell{grid-template-columns:1fr}.side{display:none}.main{padding:18px}.metrics{grid-template-columns:1fr}}</style></head><body><section id="login" class="login"><div class="login-box"><h1>SM ERP</h1><p>企业资源管理系统</p><label>账号</label><input id="username" value="admin"><label>密码</label><input id="password" type="password" value="admin"><button onclick="login()">登录 ERP</button><p id="error" class="muted"></p></div></section><section id="app" class="shell hidden"><aside class="side"><div class="brand">SM ERP</div><div class="nav">运营概览</div></aside><main class="main"><div class="top"><div><h1>企业运营概览</h1><p class="muted">组织、人员与权限管理</p></div><button onclick="logout()">退出</button></div><div class="metrics"><div class="card"><div class="muted">在职员工</div><div id="employees" class="value">--</div><div class="muted">已启用 ERP 账号</div></div><div class="card"><div class="muted">组织部门</div><div id="departments" class="value">--</div><div class="muted">部门与权限范围</div></div></div><div class="card"><h2>最近活动</h2><table class="table"><thead><tr><th>操作人</th><th>操作</th><th>时间</th></tr></thead><tbody id="activities"></tbody></table></div></main></section><script>let user=null;const h=()=>({'X-User-Id':user?.id||''});async function login(){const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value,password:password.value})});const d=await r.json();if(!r.ok){error.textContent=d.detail||'登录失败';return}user=d;localStorage.setItem('erp-user',JSON.stringify(d));show()}async function show(){user=user||JSON.parse(localStorage.getItem('erp-user')||'null');if(!user)return;login.classList.add('hidden');app.classList.remove('hidden');const r=await fetch('/api/dashboard',{headers:h()});const d=await r.json();employees.textContent=d.employees;departments.textContent=d.departments;activities.innerHTML=d.activities.map(x=>`<tr><td>${x.actor_id}</td><td>${x.action}</td><td>${x.created_at}</td></tr>`).join('')}function logout(){localStorage.removeItem('erp-user');location.reload()}show()</script></body></html>
